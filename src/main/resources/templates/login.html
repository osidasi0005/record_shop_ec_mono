<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>ログイン - Record Shop</title>
    <link rel="stylesheet" th:href="@{/css/main.css}"/>
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>
<main>
    <div class="card form-card">
        <h1>ログイン</h1>

        <p class="notice" th:if="${param.registered}">会員登録が完了しました。ログインしてください。</p>
        <p class="error" th:if="${param.error}">メールアドレスまたはパスワードが正しくありません。</p>
        <p class="notice" th:if="${param.logout}">ログアウトしました。</p>

        <form th:action="@{/login}" method="post" autocomplete="off">
            <div class="field">
                <label for="username">メールアドレス</label>
                <input type="email" id="username" name="username" required autofocus autocomplete="off"/>
            </div>
            <div class="field">
                <label for="password">パスワード</label>
                <input type="password" id="password" name="password" required autocomplete="off"/>
            </div>
            <button type="submit">ログイン</button>
        </form>

        <p class="muted" style="margin-top:1rem;">
            アカウントをお持ちでない方は <a th:href="@{/register}">会員登録</a>
        </p>
    </div>
</main>
</body>
</html>

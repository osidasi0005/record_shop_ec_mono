<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <!--
    独自生成のジャケット風プレースホルダー画像(実物ジャケットの複製ではない)。
    タイトル/アーティスト名の文字列から決定的に導出した色相・図形配置で構成する。
    Title="Blue Train" -> hue=214, secondaryHue=4 / Artist="John Coltrane" -> shapeCount=3
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="hsl(214,45%,26%)"/>
      <stop offset="100%" stop-color="hsl(214,55%,8%)"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bg)"/>
  <circle cx="97" cy="83" r="20" fill="hsl(4,60%,55%)" opacity="0.85"/>
  <polygon points="164,53 194,113 134,113" fill="hsl(4,60%,45%)" opacity="0.8"/>
  <rect x="231" y="83" width="37" height="37" fill="hsl(4,60%,65%)" opacity="0.75" transform="rotate(12 249 101)"/>
  <circle cx="120" cy="180" r="70" fill="none" stroke="hsl(214,40%,70%)" stroke-width="2" opacity="0.35"/>
  <circle cx="120" cy="180" r="46" fill="none" stroke="hsl(214,40%,70%)" stroke-width="2" opacity="0.3"/>
  <circle cx="120" cy="180" r="22" fill="none" stroke="hsl(214,40%,70%)" stroke-width="2" opacity="0.25"/>
  <rect x="0" y="266" width="400" height="134" fill="rgba(0,0,0,0.5)"/>
  <text x="24" y="322" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="bold" fill="#fdfdfd">Blue Train</text>
  <text x="24" y="354" font-family="Georgia, 'Times New Roman', serif" font-size="18" fill="#e6e6e6">John Coltrane</text>
</svg>

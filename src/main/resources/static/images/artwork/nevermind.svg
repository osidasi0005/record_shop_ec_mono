  <rect x="0" y="266" width="400" height="134" fill="rgba(0,0,0,0.55)"/>
  <text x="24" y="326" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="bold" fill="#fdfdfd">Nevermind</text>
  <text x="24" y="358" font-family="Georgia, 'Times New Roman', serif" font-size="18" fill="#e6e6e6">Nirvana</text>
</svg>

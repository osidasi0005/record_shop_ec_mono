# server.forward-headers-strategy はあえて使わない(=デフォルトのnone)。record-shop-ec-jpa(JPA版)と
# 同じ理由: CloudFront(HTTPS)→ALB→Fargate(HTTP)構成ではALBがX-Forwarded-Protoを毎回上書きしてしまうため、
# 代わりにCloudFrontProtoFilter(infrastructure.web、JPA版から無修正コピー)でscheme/isSecureを直接上書きする。

spring:
  application:
    name: record-shop-ec-mybatis
  datasource:
    # record-shop-ec-jpa(JPA版)と同時起動できるよう、ポート・DB名をずらしている(docker-compose.yml参照)
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:recordshop_mybatis}
    username: ${DB_USERNAME:recordshop}
    password: ${DB_PASSWORD:recordshop}
  sql:
    init:
      # 比較実験用の簡略化: 起動のたびにschema.sqlでテーブルを作り直す(データは永続化しない)
      mode: always

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-handlers-package: com.example.recordshop.infrastructure.mybatis
  configuration:
    map-underscore-to-camel-case: true
    # 発行されるSQLをログで確認できるようにしておく(N+1になっていないかの目視確認用)
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

logging:
  level:
    com.example.recordshop.infrastructure.mybatis: debug

management:
  endpoints:
    web:
      exposure:
        # ALB/ECSのヘルスチェックが叩く /actuator/health のみ公開する
        include: health
  endpoint:
    health:
      show-details: never

app:
  admin:
    # 起動時に管理者アカウントを1件だけ起票する(AdminAccountSeeder)。
    # 未設定のままだと /admin/** に入れる会員が誰もいない状態になる。
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}

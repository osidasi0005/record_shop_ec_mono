name: Security

# 依存とインフラ定義・イメージに既知の脆弱性・設定不備が無いかを Trivy で見る。
#
# **結果を GitHub の Code Scanning(SARIF)へは送っていない。**
# 組織で Code Security が無効なら送っても弾かれる(有効化すると committer 単位の
# 課金が発生する)。表形式でログに出し、CRITICAL / HIGH が出たらジョブを落とす方式にしてある。
# 有効化したときは、各ステップを format: sarif + github/codeql-action/upload-sarif に
# 差し替える。
#
# **このジョブは Ruleset の必須チェックに入れない。** 自分のコードの誤りではなく
# 「世の中で新しく見つかった脆弱性」で赤くなるため、マージそのものを止めると
# 身動きが取れなくなる。赤は「見て判断する合図」として扱う。
on:
  pull_request:
  push:
    branches: [main]
  # コードが変わらなくても脆弱性は増える。新しく公表されたものを週1で拾う。
  # (private リポジトリでは 60 日活動が無いと GitHub 側で自動停止される)
  schedule:
    - cron: '0 0 * * 1'   # 毎週月曜 09:00 JST
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # **event_name を含める。** schedule / workflow_dispatch / main への push は
  # どれも github.ref が refs/heads/main になるため、これが無いと同じグループに入り、
  # 月曜の定期実行が同時刻の push に黙ってキャンセルされる
  # (定期実行でしか走らない検査が、気付かないまま欠ける)。
  group: security-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  scan:
    name: 脆弱性スキャン
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # リポジトリ全体(mybatis と cdk の両方の package-lock.json / pom.xml)に
      # 既知の脆弱性が無いか。モノレポなので scan-ref はリポジトリ直下にする。
      # ignore-unfixed: 修正版がまだ出ていないものは上げようが無いので、ここでは落とさない。
      - name: 依存の脆弱性
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
          format: table

      # Dockerfile の書き方の問題(root 実行、latest タグなど)。中身のパッケージは
      # 見ない(それは下の image-scan の仕事)。
      - name: Dockerfile の設定不備
        # **前のステップが落ちても実行する。** 既定では失敗した時点で以降が skip されるため、
        # 依存に CVE が出ている週は Dockerfile の検査が一度も走らなくなる。
        # 見たいのは別々のものなので、毎回そろえて出す。
        if: ${{ !cancelled() }}
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: record-shop-ec-mybatis/Dockerfile
          severity: CRITICAL,HIGH
          exit-code: '1'
          format: table

      # record-shop-ec-cdk/infra には、OIDC ロールのような CDK アプリの外にある
      # 手書きの CloudFormation テンプレートを置く想定。**今はまだ存在しない**
      # (ECR と OIDC ロールをこの PR では作っていない)ため、無ければスキップする。
      - name: record-shop-ec-cdk/infra の有無を確認する
        id: infra-dir
        if: ${{ !cancelled() }}
        run: |
          if [ -d "record-shop-ec-cdk/infra" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::record-shop-ec-cdk/infra がまだ無いため、IaC の設定不備スキャンをスキップしました。"
          fi

      - name: IaC(record-shop-ec-cdk/infra)の設定不備
        if: ${{ !cancelled() && steps.infra-dir.outputs.exists == 'true' }}
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: record-shop-ec-cdk/infra
          severity: CRITICAL,HIGH
          exit-code: '1'
          format: table

  image-scan:
    name: イメージの脆弱性スキャン
    runs-on: ubuntu-latest

    # **今回は ECR の実物を見る部分を入れない。** ECR リポジトリと OIDC ロールが
    # まだ無いため、main マージ後に push 済みイメージを pull し直す経路
    # (audio-shop-ec-cdk の security.yml が持つ形)は作れない。
    # OIDC / ECR を用意したら、この工程を deploy-stage 相当のワークフローの後続
    # (needs:)へ移し、「実際に Stage・本番へ載るイメージ」を見る形にする。
    steps:
      - uses: actions/checkout@v7

      - name: イメージをビルドする(スキャン用)
        working-directory: record-shop-ec-mybatis
        run: docker build -t record-shop-ec-mybatis:scan .

      # OS パッケージと依存の両方を見る。Dockerfile の静的な検査では出てこない層。
      - name: イメージの脆弱性
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: record-shop-ec-mybatis:scan
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
          format: table

name: setup-aws
description: >-
  deploy / release 系のワークフローが共通で必要とする土台(record-shop-ec-cdk の依存を入れて、
  OIDC で AWS の一時資格情報を取る)を用意する。

# **この action はモノレポの .github/actions/setup-aws に置く(record-shop-ec-cdk と同じリポジトリ)。**
# 雛形(cicd_playbook/templates/github)は「アプリ側リポジトリ」「インフラ側リポジトリ」の
# 2 リポジトリ構成を前提にしていたが、このリポジトリは 1 つのモノレポで両方を兼ねるため、
# 別リポジトリの checkout は不要。呼び出し元は `uses: ./.github/actions/setup-aws` の形で呼ぶ。

inputs:
  role-to-assume:
    description: OIDC で引き受ける IAM ロールの ARN(変数 AWS_DEPLOY_ROLE_ARN を渡す想定)。
    required: true
  aws-region:
    description: 操作対象のリージョン。
    required: true
  role-duration-seconds:
    description: >-
      一時資格情報の有効期間(秒)。ロールの MaxSessionDuration が上限。
      既定の 3600 で足りない初回構築だけ、呼ぶ側で延ばす。
    required: false
    default: "3600"

runs:
  using: composite
  steps:
    # このファイル自身(action.yml)は <リポジトリのルート>/.github/actions/setup-aws/ にある。
    # ハードコードせず github.action_path から3階層さかのぼって求める
    # (setup-aws → actions → .github → <リポジトリのルート> の3段)。
    - name: record-shop-ec-cdk のディレクトリを特定する
      id: paths
      shell: bash
      run: |
        set -euo pipefail
        repo_root="$(cd "${{ github.action_path }}/../../.." && pwd)"
        echo "infra_dir=${repo_root}/record-shop-ec-cdk" >> "$GITHUB_OUTPUT"

    - name: Node.js を用意する
      uses: actions/setup-node@v7
      with:
        # バージョンは record-shop-ec-cdk/.nvmrc が正(呼び出し元の言語と違うことがあるので、
        # 明示的にこのパスを指す)。
        node-version-file: ${{ steps.paths.outputs.infra_dir }}/.nvmrc
        cache: npm
        cache-dependency-path: ${{ steps.paths.outputs.infra_dir }}/package-lock.json

    - name: record-shop-ec-cdk の依存を入れる
      shell: bash
      working-directory: ${{ steps.paths.outputs.infra_dir }}
      run: npm ci

    # 長期のアクセスキーは置かない。ジョブごとに、期限つきの一時資格情報を取る。
    # 長さは role-duration-seconds(既定 1 時間)で決める。
    - name: AWS を OIDC で認証する
      uses: aws-actions/configure-aws-credentials@v6
      with:
        role-to-assume: ${{ inputs.role-to-assume }}
        aws-region: ${{ inputs.aws-region }}
        role-session-name: gha-${{ github.run_id }}
        role-duration-seconds: ${{ inputs.role-duration-seconds }}

    # スクリプトの「前提を確認する」工程と同じ確認を先に済ませ、欠けているならここで落とす。
    # デプロイの途中で落ちるより、どの前提が欠けたか読み取りやすい。
    - name: 前提を確認する
      shell: bash
      run: |
        set -euo pipefail
        aws --version
        aws sts get-caller-identity --query Account --output text
        echo "前提は揃っています"

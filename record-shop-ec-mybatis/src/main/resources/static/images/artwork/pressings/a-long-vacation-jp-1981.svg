<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <!-- 独自生成のプレス版アートワーク(実物レーベルの複製ではない)。Release本体のhue=310/100を継承。 -->
  <rect width="400" height="400" fill="hsl(310,30%,18%)"/>
  <circle cx="200" cy="176" r="130" fill="hsl(310,35%,12%)" stroke="hsl(100,35%,60%)" stroke-width="2"/>
  <circle cx="200" cy="176" r="100" fill="none" stroke="hsl(100,30%,55%)" stroke-width="1" opacity="0.5"/>
  <circle cx="200" cy="176" r="70" fill="none" stroke="hsl(100,30%,55%)" stroke-width="1" opacity="0.5"/>
  <circle cx="200" cy="176" r="42" fill="hsl(50,80%,70%)"/>
  <circle cx="200" cy="176" r="6" fill="hsl(310,30%,14%)"/>
  <text x="200" y="171" text-anchor="middle" font-family="Georgia, serif" font-size="12" font-weight="bold" fill="#fdfdfd">Sony/CBS</text>
  <text x="200" y="188" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#f0f0f0">25AH 1444</text>
  <rect x="0" y="330" width="400" height="70" fill="rgba(0,0,0,0.55)"/>
  <text x="200" y="360" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#fdfdfd">JP &#183; 1981</text>
  <text x="200" y="382" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#dadada">Original Pressing</text>
</svg>

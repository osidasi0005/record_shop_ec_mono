  <circle cx="200" cy="176" r="100" fill="none" stroke="hsl(6,40%,50%)" stroke-width="1" opacity="0.5"/>
  <circle cx="200" cy="176" r="70" fill="none" stroke="hsl(6,40%,50%)" stroke-width="1" opacity="0.5"/>
  <circle cx="200" cy="176" r="42" fill="hsl(6,45%,50%)"/>
  <circle cx="200" cy="176" r="6" fill="hsl(216,25%,12%)"/>
  <text x="200" y="171" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-weight="bold" fill="#fdfdfd">DGC</text>
  <text x="200" y="188" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#f0f0f0">DGC-24425</text>
  <rect x="0" y="330" width="400" height="70" fill="rgba(0,0,0,0.55)"/>

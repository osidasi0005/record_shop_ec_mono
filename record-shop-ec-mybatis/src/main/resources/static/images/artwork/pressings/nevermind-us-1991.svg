<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <!-- 独自生成のプレス版アートワーク(実物レーベルの複製ではない)。Release本体のhue=216/6を継承。 -->
  <rect width="400" height="400" fill="hsl(216,20%,18%)"/>

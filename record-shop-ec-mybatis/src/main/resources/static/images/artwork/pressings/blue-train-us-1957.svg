  <circle cx="200" cy="176" r="100" fill="none" stroke="hsl(4,45%,50%)" stroke-width="1" opacity="0.5"/>
  <circle cx="200" cy="176" r="70" fill="none" stroke="hsl(4,45%,50%)" stroke-width="1" opacity="0.5"/>
  <circle cx="200" cy="176" r="42" fill="hsl(4,55%,50%)"/>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>会員登録 - Record Shop</title>
    <link rel="stylesheet" th:href="@{/css/main.css}"/>
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>
<main>
    <div class="card form-card">
        <h1>会員登録</h1>

        <p class="error" th:if="${errorMessage}" th:text="${errorMessage}"></p>

        <form th:action="@{/register}" th:object="${registerForm}" method="post">
            <div class="field">
                <label for="displayName">お名前</label>
                <input type="text" id="displayName" th:field="*{displayName}" required/>
            </div>
            <div class="field">
                <label for="email">メールアドレス</label>
                <input type="email" id="email" th:field="*{email}" required/>
            </div>
            <div class="field">
                <label for="password">パスワード(8文字以上)</label>
                <input type="password" id="password" th:field="*{password}" required minlength="8"/>
            </div>
            <button type="submit">登録する</button>
        </form>

        <p class="muted" style="margin-top:1rem;">
            既にアカウントをお持ちの方は <a th:href="@{/login}">ログイン</a>
        </p>
    </div>
</main>
</body>
</html>

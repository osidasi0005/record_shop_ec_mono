<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>商品一覧 - Record Shop</title>
    <link rel="stylesheet" th:href="@{/css/main.css}"/>
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>
<main>
    <h1>商品一覧</h1>

    <p class="error" th:if="${errorMessage}" th:text="${errorMessage}"></p>

    <p class="muted" th:if="${#lists.isEmpty(releases)}">まだ商品が登録されていません。</p>

    <div class="release-list">
        <a class="release-card" th:each="release : ${releases}"
           th:href="@{'/catalog/' + ${release.releaseId}}">
            <img class="artwork-thumb" th:if="${release.artworkUrl}" th:src="${release.artworkUrl}" alt=""/>
            <div class="title" th:text="${release.title}">タイトル</div>
            <div class="artist" th:text="${release.artistName}">アーティスト</div>
            <div class="muted" th:text="${release.originalReleaseYear}">1970</div>
        </a>
    </div>
</main>
</body>
</html>

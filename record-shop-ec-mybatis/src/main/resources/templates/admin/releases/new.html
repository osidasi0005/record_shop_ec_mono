<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>管理画面: 作品登録 - Record Shop</title>
    <link rel="stylesheet" th:href="@{/css/main.css}"/>
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>
<main>
    <p><a th:href="@{/admin/releases}">&larr; 作品一覧に戻る</a></p>
    <h1>作品を登録</h1>

    <div class="card form-card" style="margin-left:0;">
        <p class="error" th:if="${errorMessage}" th:text="${errorMessage}"></p>

        <form th:action="@{/admin/releases}" th:object="${releaseForm}" method="post">
            <div class="field">
                <label for="title">タイトル</label>
                <input type="text" id="title" th:field="*{title}" required/>
            </div>
            <div class="field">
                <label for="artistName">アーティスト</label>
                <input type="text" id="artistName" th:field="*{artistName}" required/>
            </div>
            <div class="field">
                <label for="genres">ジャンル(カンマ区切り)</label>
                <input type="text" id="genres" th:field="*{genres}" placeholder="Jazz, Soul"/>
            </div>
            <div class="field">
                <label for="originalReleaseYear">発売年</label>
                <input type="number" id="originalReleaseYear" th:field="*{originalReleaseYear}" required/>
            </div>
            <div class="field">
                <label for="artworkUrl">ジャケット画像URL(任意)</label>
                <input type="url" id="artworkUrl" th:field="*{artworkUrl}" placeholder="https://..."/>
            </div>
            <button type="submit">登録する</button>
        </form>
    </div>
</main>
</body>
</html>
